# Optional: builds the macOS .dmg on a Mac registered as a Forgejo runner with
# the label "macos". See docs/releasing.md for how to set that up.
#
# It only starts by hand (Actions -> Build macOS -> Run workflow, on the tag to
# build). Forgejo leaves a job waiting until a runner with its label picks it
# up, even when the job has an "if:" that is false, so starting this for every
# tag would leave a run waiting forever on a server without a Mac runner.
# Once a Mac runner exists, uncomment the "push" lines below to have every tag
# built automatically.
#
# Without a Mac runner the dmg is built with scripts/release-macos.sh --upload.
name: Build macOS

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

jobs:
  macos:
    name: macOS dmg
    runs-on: macos
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "Runner: $(uname -sm), macOS $(sw_vers -productVersion)"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraHeader=Authorization: Basic $auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD
          git submodule update -q --init --recursive --depth 1 \
            test/munit third-party/nanopb third-party/jerasure third-party/gf-complete \
            third-party/curl third-party/cpp-steam-tools
          git log -1 --format='Checked out %h %s'

      - name: Build
        run: scripts/release-macos.sh

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-release.sh dist/*.dmg dist/*.sha256

      # Needs Node.js on the Mac (brew install node)
      - name: Keep the dmg as an artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          if-no-files-found: error
          retention-days: 14
